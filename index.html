<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Number Guessing Game</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f3efe6;
    --card: #fffdf8;
    --ink: #1f2a37;
    --muted: #6b7280;
    --line: #d9d2c0;
    --accent: #2f6f5e;
    --accent-ink: #ffffff;
    --hot: #c2410c;
    --cold: #1d4ed8;
    --win: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181c; --card: #1d2329; --ink: #e8ecef; --muted: #98a2ad;
      --line: #323b44; --accent: #5fb99f; --accent-ink: #0d1512;
      --hot: #fb923c; --cold: #7aa2ff; --win: #4ade80;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181c; --card: #1d2329; --ink: #e8ecef; --muted: #98a2ad;
    --line: #323b44; --accent: #5fb99f; --accent-ink: #0d1512;
    --hot: #fb923c; --cold: #7aa2ff; --win: #4ade80;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .game {
    width: 100%; max-width: 440px; background: var(--card);
    border: 2px solid var(--line); border-radius: 18px; padding: 28px 24px;
    box-shadow: 0 6px 0 var(--line);
  }
  h1 { margin: 0 0 4px; font-size: 1.7rem; letter-spacing: -0.5px; }
  .sub { margin: 0 0 20px; color: var(--muted); line-height: 1.4; }
  .levels { display: flex; gap: 8px; margin-bottom: 20px; }
  .levels button {
    flex: 1; padding: 8px 4px; border: 2px solid var(--line); background: transparent;
    color: var(--ink); border-radius: 10px; font: inherit; font-size: .9rem; cursor: pointer;
  }
  .levels button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .stats { display: flex; justify-content: space-between; font-size: .95rem; color: var(--muted); margin-bottom: 8px; }
  .stats strong { color: var(--ink); }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
  .bar span { display: block; height: 100%; width: 100%; background: var(--accent); transition: width .3s, background .3s; }
  .row { display: flex; gap: 10px; }
  input[type="number"] {
    flex: 1; min-width: 0; padding: 14px; font: inherit; font-size: 1.4rem; text-align: center;
    border: 2px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink);
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .go {
    padding: 0 22px; border: 0; border-radius: 12px; background: var(--accent);
    color: var(--accent-ink); font: inherit; font-weight: 700; cursor: pointer;
  }
  .go:disabled, input:disabled { opacity: .5; cursor: not-allowed; }
  .msg { min-height: 56px; margin: 18px 0 8px; font-size: 1.15rem; font-weight: 700; text-align: center; display: flex; align-items: center; justify-content: center; }
  .msg.hot { color: var(--hot); } .msg.cold { color: var(--cold); }
  .msg.win { color: var(--win); } .msg.lose { color: var(--hot); } .msg.warn { color: var(--muted); }
  .history { display: flex; flex-wrap: wrap; gap: 6px; min-height: 32px; margin-bottom: 18px; }
  .chip { padding: 4px 10px; border-radius: 99px; font-size: .85rem; border: 1px solid var(--line); }
  .chip.high { color: var(--hot); } .chip.low { color: var(--cold); }
  .again {
    width: 100%; padding: 12px; border: 2px solid var(--ink); background: transparent;
    color: var(--ink); border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer;
  }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } .bar span { transition: none; } }
</style>
</head>
<body>
<main class="game">
  <h1>Guess the number</h1>
  <p class="sub" id="sub"></p>

  <div class="levels" id="levels">
    <button data-max="10">Easy 1–10</button>
    <button data-max="50" class="active">Medium 1–50</button>
    <button data-max="100">Hard 1–100</button>
  </div>

  <div class="stats">
    <span>Tries left: <strong id="left"></strong></span>
    <span>Best: <strong id="best">–</strong></span>
  </div>
  <div class="bar"><span id="bar"></span></div>

  <div class="row">
    <input type="number" id="guess" inputmode="numeric" aria-label="Your guess" placeholder="?">
    <button class="go" id="go">Guess</button>
  </div>

  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="history" id="history"></div>
  <button class="again" id="again">New game</button>
</main>

<script>
  let max = 50, maxTries = 7, secret, tries, over, best = null;

  const $ = id => document.getElementById(id);
  const input = $("guess"), msg = $("msg");

  // Pick tries based on range (roughly log2 of range + 1)
  function triesFor(m) { return Math.ceil(Math.log2(m)) + 1; }

  function newGame() {
    // Math.random() gives 0 <= n < 1, so scale it and shift to 1..max
    secret = Math.floor(Math.random() * max) + 1;
    maxTries = triesFor(max);
    tries = 0; over = false;
    $("sub").textContent = "I'm thinking of a number between 1 and " + max + ". You get " + maxTries + " tries.";
    input.min = 1; input.max = max; input.value = "";
    input.disabled = false; $("go").disabled = false;
    $("history").innerHTML = "";
    setMsg("Make your first guess.", "warn");
    updateStats(); input.focus();
  }

  function updateStats() {
    const left = maxTries - tries;
    $("left").textContent = left;
    const pct = (left / maxTries) * 100;
    $("bar").style.width = pct + "%";
    $("bar").style.background = pct > 50 ? "var(--accent)" : pct > 25 ? "var(--cold)" : "var(--hot)";
  }

  function setMsg(text, cls) { msg.textContent = text; msg.className = "msg " + cls; }

  function endGame() {
    over = true; input.disabled = true; $("go").disabled = true;
  }

  function guess() {
    if (over) return;
    const n = Number(input.value);
    if (!input.value || !Number.isInteger(n) || n < 1 || n > max) {
      setMsg("Enter a whole number from 1 to " + max + ".", "warn");
      input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
      return;
    }
    tries++;
    const chip = document.createElement("span");
    chip.className = "chip " + (n > secret ? "high" : "low");
    chip.textContent = n + (n > secret ? " ▼" : " ▲");

    if (n === secret) {
      chip.className = "chip"; chip.textContent = n + " ✔";
      $("history").appendChild(chip);
      setMsg("Correct! You got it in " + tries + (tries === 1 ? " try." : " tries."), "win");
      if (best === null || tries < best) { best = tries; $("best").textContent = best; }
      updateStats(); endGame(); return;
    }

    $("history").appendChild(chip);
    const diff = Math.abs(n - secret);
    const close = diff <= Math.max(1, Math.round(max * 0.1));
    const dir = n > secret ? "Too high" : "Too low";
    setMsg(dir + (close ? " – but you're close!" : "."), close ? "hot" : "cold");

    updateStats();
    if (tries >= maxTries) {
      setMsg("Out of tries. The number was " + secret + ".", "lose");
      endGame(); return;
    }
    input.value = ""; input.focus();
  }

  $("go").addEventListener("click", guess);
  input.addEventListener("keydown", e => { if (e.key === "Enter") guess(); });
  $("again").addEventListener("click", newGame);
  $("levels").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#levels button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    max = Number(b.dataset.max); best = null; $("best").textContent = "–";
    newGame();
  });

  newGame();
</script>
</body>
</html>
